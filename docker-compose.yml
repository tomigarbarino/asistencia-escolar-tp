services:
  mysql:
    image: mysql:8.4
    container_name: asistencia_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asistencia_escolar}
      MYSQL_USER: ${MYSQL_USER:-asistencia_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-asistencia_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - asistencia_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: asistencia_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"

  backend:
    build:
      context: ./backend
    container_name: asistencia_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-asistencia_escolar}
      DB_USER: ${MYSQL_USER:-asistencia_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-asistencia_pass}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

volumes:
  asistencia_mysql_data:
